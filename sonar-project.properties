sonar.projectKey=vitaliilatysh_quizproject-web
sonar.organization=vitaliilatysh
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests,e2e
sonar.test.inclusions=tests/**/*.test.ts,e2e/**/*.spec.ts
sonar.typescript.tsconfigPaths=tsconfig.json

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.tsx,src/types.ts,src/features/admin/contracts.ts

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

