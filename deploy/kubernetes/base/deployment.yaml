apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-web
  namespace: quizproject
  labels:
    app.kubernetes.io/name: quiz-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: quizproject
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quiz-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quiz-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: quizproject
    spec:
      serviceAccountName: quiz-web
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: quiz-web
          image: quizproject-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/runtime-config.js
              subPath: runtime-config.js
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: runtime-config
          configMap:
            name: quiz-web-runtime
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 32Mi
