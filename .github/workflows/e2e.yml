name: Full-stack E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: React, Spring Boot, MySQL and Redis
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tests_db
          MYSQL_ROOT_PASSWORD: e2e-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:8.2.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out frontend
        uses: actions/checkout@v7
        with:
          path: frontend

      - name: Check out backend contract
        uses: actions/checkout@v7
        with:
          repository: vitaliilatysh/quizproject
          ref: master
          path: backend

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Refresh backend dependency lock state
        working-directory: backend
        run: ./gradlew dependencies :api:dependencies --write-locks --no-daemon

      - name: Package API
        working-directory: backend
        shell: bash
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/tests_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: e2e-root
        run: |
          # Keep the E2E workflow green while P13 rolls out; the Spring-only backend
          # applies classpath migrations automatically during application startup.
          if [[ -d resources/db/migration ]]; then
            ./gradlew processResources flywayMigrate --no-daemon
          fi
          ./gradlew :api:bootJar --no-daemon

      - name: Start API and wait for readiness
        working-directory: backend
        shell: bash
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/tests_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: e2e-root
          REDIS_HOST: 127.0.0.1
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
          API_RATE_LIMIT_REQUESTS: '1000'
          LOGIN_RATE_LIMIT_REQUESTS: '100'
        run: |
          API_JAR="$(find api/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$API_JAR"
          export JWT_SECRET="$(openssl rand -base64 32 | tr -d '\n')"
          nohup java -jar "$API_JAR" > api-e2e.log 2>&1 &
          echo $! > api-e2e.pid

          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8081/actuator/health/readiness > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat api-e2e.log
          exit 1

      - name: Create administrator fixture
        shell: bash
        run: |
          E2E_ADMIN_USERNAME=e2eadmin
          E2E_ADMIN_PASSWORD="$(openssl rand -hex 16)Aa1!"
          echo "::add-mask::$E2E_ADMIN_PASSWORD"
          echo "E2E_ADMIN_USERNAME=$E2E_ADMIN_USERNAME" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD" >> "$GITHUB_ENV"

          PAYLOAD="$(jq -n \
            --arg username "$E2E_ADMIN_USERNAME" \
            --arg password "$E2E_ADMIN_PASSWORD" \
            '{username: $username, firstName: "Endtoend", lastName: "Admin", password: $password}')"
          curl --silent --show-error --fail \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            http://127.0.0.1:8081/api/v1/auth/register > /dev/null

          docker exec "${{ job.services.mysql.id }}" mysql \
            -uroot -pe2e-root tests_db \
            -e "UPDATE users SET role_id = (SELECT id FROM roles WHERE name = 'admin') WHERE login = '$E2E_ADMIN_USERNAME';"

      - name: Run full-stack browser tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: api-e2e-log
          path: backend/api-e2e.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop API
        if: always()
        working-directory: backend
        shell: bash
        run: test ! -f api-e2e.pid || kill "$(cat api-e2e.pid)" || true
