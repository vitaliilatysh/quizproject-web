name: Deploy

on:
  workflow_run:
    workflows: ["Container delivery"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: DigitalOcean environment
        type: choice
        options: [staging, production]
        default: production
      image_tag:
        description: "Published image tag (default: sha- of the selected commit)"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: digitalocean-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DigitalOcean
    # Automatic staging is opt-in: a single production Droplet must not get a
    # second database/stack just because a default-branch image was published.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (vars.DO_STAGING_ENABLED == 'true'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'staging' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      DO_HOST: ${{ vars.DO_HOST }}
      DO_SSH_USER: ${{ vars.DO_SSH_USER || 'deploy' }}
      DO_SSH_PORT: ${{ vars.DO_SSH_PORT || '22' }}

    steps:
      - name: Check out the commit being deployed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check the DigitalOcean connection is configured
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          for name in DO_HOST DO_SSH_USER DO_SSH_KEY DO_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure ${name} in the ${DEPLOY_ENV} GitHub environment."
              exit 1
            fi
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the published image to a digest
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        shell: bash
        run: |
          TAG="${IMAGE_TAG:-sha-${DEPLOY_SHA}}"
          [[ "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]
          docker pull "${IMAGE_NAME}:${TAG}"
          DIGESTS="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE_NAME}:${TAG}")"
          DIGEST_REF="$(grep -m 1 "^${IMAGE_NAME}@sha256:" <<<"${DIGESTS}")"
          test -n "${DIGEST_REF}"
          echo "DIGEST_REF=${DIGEST_REF}" >> "$GITHUB_ENV"

      - name: Verify the image signature before deploying it
        shell: bash
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp \
              '^https://github.com/vitaliilatysh/quizproject-web/\.github/workflows/container\.yml@refs/heads/main$' \
            "${DIGEST_REF}" > /dev/null

      - name: Require successful checks before production
        if: env.DEPLOY_ENV == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          IMAGE_SHA="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${DIGEST_REF}")"
          python3 .github/scripts/verify_release.py \
            --repo "${GITHUB_REPOSITORY}" --branch main \
            --sha "${IMAGE_SHA}" --sha "${DEPLOY_SHA}" \
            --workflow ci.yml --workflow sonarqube.yml --workflow container.yml --workflow e2e.yml

      - name: Deploy the verified image over SSH
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          bash deploy/digitalocean/ship.sh frontend "$DEPLOY_ENV" "$DIGEST_REF" \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Summarise
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### DigitalOcean / ${DEPLOY_ENV}"
            echo "Image: ${DIGEST_REF:-unresolved}"
            echo "Commit: ${DEPLOY_SHA}"
            echo "Result: ${RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"
