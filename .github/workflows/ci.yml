name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Three steps rather than one `npm run check`, so the job list says which
      # of the three failed without opening a log. They are the same three
      # commands `npm run check` runs locally, in the same order: types first,
      # because a type error makes the other two answers uninteresting.
      #
      # The type check is a separate command on purpose. esbuild — which both
      # Vite and the unit tests transform with — erases types without checking
      # them, so nothing else in this pipeline would notice one that is wrong.
      - name: Check types
        run: npm run typecheck

      # Runs the tests and fails on a threshold, which is what `api` does with
      # jacocoTestCoverageVerification. Lines and functions are held at 100%,
      # the same as the LINE rule over there; branches are held at the level
      # they have reached, so the number can only go up.
      #
      # It runs without --enable-source-maps, and that is not an oversight.
      # Under the flag a file's comment header counts against its line total —
      # every module here reads several points low at full coverage of its
      # code, and clock.ts reads 70% with every one of its functions covered.
      # Without it the denominator is the executable lines, which is what
      # JaCoCo's LINE counter measures and what a 100% threshold can mean.
      # `npm run coverage` is the same run with the flag: worse totals, but
      # correct attribution, which is what finding a gap needs.
      - name: Run unit tests and check coverage
        run: npm run coverage:check

      - name: Build
        run: npm run build
