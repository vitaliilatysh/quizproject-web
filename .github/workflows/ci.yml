name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Three steps rather than one `npm run check`, so the job list says which
      # of the three failed without opening a log. They are the same three
      # commands `npm run check` runs locally, in the same order: types first,
      # because a type error makes the other two answers uninteresting.
      #
      # The type check is a separate command on purpose. esbuild — which both
      # Vite and the unit tests transform with — erases types without checking
      # them, so nothing else in this pipeline would notice one that is wrong.
      - name: Check types
        run: npm run typecheck

      # Formatting, decided once and checked rather than argued about. It is
      # here because a line of JSX in this repository had reached 1174
      # characters — the whole of one admin section, its markup, its handlers
      # and its Ukrainian text, on one line — and nothing in the pipeline had an
      # opinion about that. Prettier owns the TypeScript and nothing else;
      # .prettierignore says why.
      - name: Check formatting
        run: npm run format:check

      # One rule family, react-hooks, and no more. Types are the step above;
      # SonarCloud has its own workflow. A hook called conditionally fails the
      # build; exhaustive-deps is a warning, because oxlint reads it more
      # strictly than React does and demands whole objects where this code
      # depends on one stable callback of them. .oxlintrc.json says why for
      # each rule it turns off.
      - name: Lint
        run: npm run lint

      # Runs the tests and fails on a threshold, which is what `api` does with
      # jacocoTestCoverageVerification. Lines and functions are held at 100%,
      # the same as the LINE rule over there; branches are held at the level
      # they have reached, so the number can only go up.
      #
      # Lines are counted by scripts/coverage-lines.mts rather than by Node.
      # V8 reports offsets into the esbuild output while Node's report is
      # written against the file on disk, so an original line the source map
      # never mentions cannot be shown as executed and counts against the total
      # anyway — a number that moved when prose moved. The script counts only
      # the lines the map puts generated code on. Functions and branches stay
      # with Node, which counts those per range and does not have the problem.
      # `npm run coverage` is the unthresholded run, for finding a gap.
      - name: Run unit tests and check coverage
        run: npm run coverage:check

      - name: Build
        run: npm run build
