name: Container delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Container and manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build test image
        run: docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag quizproject-web:test .

      - name: Verify the image source revision
        shell: bash
        run: |
          IMAGE_SHA="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' quizproject-web:test)"
          test "${IMAGE_SHA}" = "${GITHUB_SHA}"

      - name: Run container smoke test
        shell: bash
        run: |
          docker run --detach --name quiz-web-test \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --publish 127.0.0.1:8080:8080 \
            quizproject-web:test

          # Fetch into a variable rather than piping curl into `grep --quiet`.
          # grep exits the moment it matches, closing the pipe while curl is
          # still writing; curl then exits 23 (CURLE_WRITE_ERROR) and, because
          # Actions runs bash with -o pipefail, that sinks the whole step even
          # though the assertion passed. Splitting the two also separates
          # "request failed" from "pattern not found".
          assert_body_contains() {
            local url="$1" pattern="$2" body
            body="$(curl --silent --fail "${url}")"
            grep --quiet "${pattern}" <<<"${body}"
          }

          for attempt in {1..30}; do
            if assert_body_contains http://127.0.0.1:8080/healthz '^ok$'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs quiz-web-test
              exit 1
            fi
            sleep 1
          done

          assert_body_contains http://127.0.0.1:8080/ 'Quiz Project'
          assert_body_contains http://127.0.0.1:8080/runtime-config.js 'QUIZ_PROJECT_API_URL'

      # Keep workflow_run subscribed to the actual image publisher name.
      - name: Check the deploy workflow waits for this one's real name
        shell: bash
        run: |
          AWAITED="$(sed -n 's/^    workflows: \["\(.*\)"\]$/\1/p' .github/workflows/deploy-digitalocean.yml)"
          test -n "${AWAITED}"
          grep --quiet "^name: ${AWAITED}$" .github/workflows/container.yml \
            || { echo "::error::deploy-digitalocean.yml waits for '${AWAITED}', which no workflow declares"; exit 1; }

      - name: Stop smoke container
        if: always()
        run: docker rm --force quiz-web-test || true


      - name: Smoke test DigitalOcean Compose deployment
        run: bash .github/scripts/smoke-digitalocean.sh

  publish:
    name: Publish immutable image
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Keyless cosign exchanges this OIDC token for a short-lived Fulcio
      # certificate, so no signing key is stored anywhere.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # This repository already verifies the backend's signature before running
      # E2E against its published image, while publishing its own image unsigned
      # — so a deploy could check the provenance of one half of the system and
      # not the other. Signed here, and verified immediately: a broken signing
      # setup fails the release instead of shipping an unsigned image.
      - name: Sign the published image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify the signature
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp \
              "^https://github.com/${{ github.repository }}/\.github/workflows/container\.yml@" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}" > /dev/null
