name: Container delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Container and manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1

      - name: Build test image
        run: docker build --tag quizproject-web:test .

      - name: Run container smoke test
        shell: bash
        run: |
          docker run --detach --name quiz-web-test \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --publish 127.0.0.1:8080:8080 \
            quizproject-web:test

          # Fetch into a variable rather than piping curl into `grep --quiet`.
          # grep exits the moment it matches, closing the pipe while curl is
          # still writing; curl then exits 23 (CURLE_WRITE_ERROR) and, because
          # Actions runs bash with -o pipefail, that sinks the whole step even
          # though the assertion passed. Splitting the two also separates
          # "request failed" from "pattern not found".
          assert_body_contains() {
            local url="$1" pattern="$2" body
            body="$(curl --silent --fail "${url}")"
            grep --quiet "${pattern}" <<<"${body}"
          }

          for attempt in {1..30}; do
            if assert_body_contains http://127.0.0.1:8080/healthz '^ok$'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs quiz-web-test
              exit 1
            fi
            sleep 1
          done

          assert_body_contains http://127.0.0.1:8080/ 'Quiz Project'
          assert_body_contains http://127.0.0.1:8080/runtime-config.js 'QUIZ_PROJECT_API_URL'

      - name: Render Kubernetes overlays
        shell: bash
        run: |
          kubectl kustomize deploy/kubernetes/overlays/local > local.yaml
          kubectl kustomize deploy/kubernetes/overlays/staging > staging.yaml
          kubectl kustomize deploy/kubernetes/overlays/production > production.yaml

          grep --quiet 'image: quizproject-web:local' local.yaml
          # Staging shares the cluster with production, so what keeps them apart
          # is worth asserting rather than assuming: its own namespace, its own
          # host, and a disruption budget that cannot block a node drain at one
          # replica.
          grep --quiet 'name: quizproject-staging' staging.yaml
          grep --quiet 'namespace: quizproject-staging' staging.yaml
          grep --quiet 'host: staging.quiz.example.com' staging.yaml
          grep --quiet 'maxUnavailable: 1' staging.yaml
          ! grep --quiet 'namespace: quizproject$' staging.yaml
          ! grep --quiet 'host: quiz.example.com' staging.yaml
          grep --quiet 'image: ghcr.io/vitaliilatysh/quizproject-web:main' production.yaml
          grep --quiet 'host: quiz.example.com' production.yaml
          grep --quiet 'name: quiz-api' production.yaml

      - name: Stop smoke container
        if: always()
        run: docker rm --force quiz-web-test || true

  publish:
    name: Publish immutable image
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Keyless cosign exchanges this OIDC token for a short-lived Fulcio
      # certificate, so no signing key is stored anywhere.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # This repository already verifies the backend's signature before running
      # E2E against its published image, while publishing its own image unsigned
      # — so a deploy could check the provenance of one half of the system and
      # not the other. Signed here, and verified immediately: a broken signing
      # setup fails the release instead of shipping an unsigned image.
      - name: Sign the published image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify the signature
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp \
              "^https://github.com/${{ github.repository }}/\.github/workflows/container\.yml@" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}" > /dev/null

      - name: Render immutable production manifest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cp -R deploy/kubernetes "$RUNNER_TEMP/kubernetes"
          PRODUCTION_OVERLAY="$RUNNER_TEMP/kubernetes/overlays/production/kustomization.yaml"
          sed -i "s|    newTag: main|    digest: ${IMAGE_DIGEST}|" "$PRODUCTION_OVERLAY"
          kubectl kustomize "$RUNNER_TEMP/kubernetes/overlays/production" \
            > "$GITHUB_WORKSPACE/quizproject-web-kubernetes.yaml"
          grep --quiet "image: ${IMAGE_NAME}@${IMAGE_DIGEST}" \
            "$GITHUB_WORKSPACE/quizproject-web-kubernetes.yaml"

      - name: Upload production manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubernetes-manifest-${{ github.sha }}
          path: quizproject-web-kubernetes.yaml
          if-no-files-found: error
          retention-days: 30
